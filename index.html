<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WishPop — One list. Zero duplicate gifts.</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">

    <!-- 1. Navigation -->
    <nav class="nav">
      <div class="logo">WishPop</div>
      <button class="btn" id="navCta" type="button">Join waitlist</button>
    </nav>

    <!-- 2. Headline block -->
    <section class="hero">
      <h1>One <span class="gray">list.</span><br>Zero <span class="gray">duplicate gifts.</span></h1>
      <p class="sub">Create a wishlist, share one link, and let your friends quietly reserve gifts — without spoiling the surprise for you.</p>

      <!-- 3. Waitlist form -->
      <form class="form" id="waitlistForm" novalidate>
        <input type="email" id="email" placeholder="Enter email address" autocomplete="email">
        <button class="btn submit" type="submit">Join wait list</button>
      </form>
    </section>

    <!-- 4. Folder stack illustration (design SVG assets, back to front) -->
    <div class="stage" aria-hidden="true">
      <img class="el el-green"   src="assets/folder-green.svg"  alt="">
      <img class="el el-yellow"  src="assets/folder-yellow.svg" alt="">
      <img class="el el-purple"  src="assets/folder-purple.svg" alt="">
      <img class="el el-red"     src="assets/folder-red.svg"    alt="">
      <img class="el el-wedding" src="assets/card-wedding.svg"  alt="">
      <img class="el el-blue"    src="assets/folder-blue.svg"   alt="">
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
