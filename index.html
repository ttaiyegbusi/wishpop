<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WishPop — One list. Zero duplicate gifts.</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">

    <!-- 1. Navigation -->
    <nav class="nav">
      <div class="logo">WishPop</div>
      <button class="btn" id="navCta" type="button">Join waitlist</button>
    </nav>

    <!-- 2. Headline block -->
    <section class="hero">
      <h1 aria-label="One wishlist. Zero duplicate gifts.">One <span class="gray"><span id="typeWord">wishlist.</span><span class="caret"></span></span><br>Zero <span class="gray">duplicate gifts.</span></h1>
      <p class="sub">Create a wishlist, share one link, and let your friends quietly reserve gifts — without spoiling the surprise for you.</p>

      <!-- 3. Waitlist form -->
      <form class="form" id="waitlistForm" novalidate>
        <input type="email" id="email" placeholder="Enter email address" autocomplete="email">
        <button class="btn submit" type="submit">Join wait list</button>
      </form>
    </section>

    <!-- 4. Folder stack illustration (full composition exported from the design).
         Inlined by js/main.js so the folder groups can animate on load. -->
    <div class="stage" id="stage" aria-hidden="true">
      <noscript><img class="hero-folders" src="assets/hero-folders.svg" alt=""></noscript>
    </div>

    <!-- Waitlist success modal -->
    <div class="modal" id="successModal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
        <img class="modal-icon" src="assets/logo-mark.svg" alt="">
        <h2 id="modalTitle">Your spot is reserved. 🎁</h2>
        <p id="modalBody">You're on the WishPop waitlist. We'll email you as soon as early access opens. No spoilers, we promise.</p>
        <button class="btn modal-ok" id="modalOk" type="button">Okay!</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
